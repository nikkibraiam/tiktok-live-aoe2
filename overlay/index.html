<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AoE Battle Overlay</title>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <link rel="stylesheet" href="overlay/styles.css">
</head>
<body>

  <!-- POWER BAR -->
<div id="power-bar">
  <div id="blue-power"></div>
  <div id="red-power"></div>
  <div id="blue-points" class="power-text"></div>
  <div id="red-points" class="power-text"></div>
</div>


  <!-- TEAMS -->
  <div id="teams">
    <div class="team blue">
      <h2>🔵👑 TOP AZUL 👑🔵</h2>
      <div class="top">
  <h3></h3>
  <ol class="top-list" id="top-vm1">
    <li class="top-player pending">💪 A GANAR 💪</li>
  </ol>
</div>
      <div class="units" id="units-vm1"></div>
    </div>

    <div class="team red">
      <h2>🔴👑 TOP ROJO 👑🔴</h2>
      <div class="top">
    <ol class="top-list" id="top-vm2">
      <li class="top-player pending"> 💪A GANAR 💪</li>
    </ol>
    </div>
      <div class="units" id="units-vm2">
      </div>
    </div>
  </div>

  <!-- INFO BAR -->
<div id="info-bar">
  <div class="info-team blue">
    <h2>🎁 EQUIPO AZUL 🎁</h2>
    <div class="info-units" id="info-vm1"></div>
  </div>

  <div class="info-team red">
    <h2>🎁 EQUIPO ROJO 🎁</h2>
    <div class="info-units" id="info-vm2"></div>
  </div>
</div>

  <script src="overlay/overlay.js"></script>
</body>
</html>
